apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: inference-api-error-rate

spec:
  args:
    - name: canary-hash

  metrics:
    - name: canary-error-rate
      initialDelay: 30s
      interval: 15s
      count: 20
      failureLimit: 2

      # No condition is met when there is no traffic.
      # Argo therefore keeps taking measurements instead
      # of treating "no data" as a failure.
      successCondition: "len(result) > 0 && result[0] < 0.25"
      failureCondition: "len(result) > 0 && result[0] >= 0.25"

      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090

          query: |
            (
              sum(
                rate(
                  http_requests_total{
                    namespace="default",
                    service="inference-api",
                    handler="/predict",
                    method="POST",
                    status=~"5..",
                    pod=~"inference-api-{{ `{{args.canary-hash}}` }}-.*"
                  }[1m]
                )
              )
            )
            /
            (
              sum(
                rate(
                  http_requests_total{
                    namespace="default",
                    service="inference-api",
                    handler="/predict",
                    method="POST",
                    pod=~"inference-api-{{ `{{args.canary-hash}}` }}-.*"
                  }[1m]
                )
              )
            )