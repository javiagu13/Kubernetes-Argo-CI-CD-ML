apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "inference-api.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      {{- include "inference-api.selectorLabels" . | nindent 6 }}

  strategy:
    canary:
      steps:
        - setWeight: 50

        - analysis:
            templates:
              - templateName: inference-api-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest

        - pause: {}

        - setWeight: 100

  template:
    metadata:
      labels:
        {{- include "inference-api.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: inference-api

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: VERSION
              value: "{{ .Values.env.VERSION }}"
            - name: FAILURE_RATE
              value: "{{ .Values.env.FAILURE_RATE | default "0" }}"
            - name: LATENCY_MS
              value: "{{ .Values.env.LATENCY_MS | default "0" }}"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            {{- toYaml .Values.resources | nindent 12 }}