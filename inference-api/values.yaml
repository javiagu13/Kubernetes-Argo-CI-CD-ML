replicaCount: 2

image:
  repository: inference-api
  tag: v2-metrics
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8000

env:
  VERSION: v3
  FAILURE_RATE: "0.5"
  LATENCY_MS: "201"

monitoring:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: kubernetes.docker.internal